openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /professional/state:
    get:
      operationId: getProfessionalState
      tags: [professional]
      responses:
        "200":
          description: Monthly services, own billing and business verification state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfessionalState"}
  /professional/actions:
    post:
      operationId: professionalAction
      tags: [professional]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfessionalActionInput"}
      responses:
        "200":
          description: Persisted action or provider checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  id: {type: integer}
  /professional/business/{memberId}:
    get:
      operationId: getProfessionalBusiness
      tags: [professional]
      parameters:
        - {name: memberId, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Business profile and community-attestation status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfessionalBusiness"}
  /professional/introductions:
    post:
      operationId: createProfessionalIntroduction
      tags: [professional]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfessionalIntroductionInput"}
      responses:
        "201":
          description: Introduction request received by TOMI, not guaranteed contact
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: integer}
  /professional/resources/{slug}:
    get:
      operationId: getProfessionalResource
      tags: [professional]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Subscription-protected professional resource
          content:
            application/json:
              schema:
                type: object
                required: [title, sections]
                properties:
                  title: {type: string}
                  sections: {type: array, items: {type: object, required: [heading, text], properties: {heading: {type: string}, text: {type: string}}}}
  /editorial/videos/{videoId}/engagement:
    get:
      operationId: getVideoEngagement
      tags: [editorial]
      parameters:
        - {name: videoId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Public counts and comments; viewer-specific ownership when signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoEngagement"}
    post:
      operationId: updateVideoEngagement
      tags: [editorial]
      parameters:
        - {name: videoId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoEngagementInput"}
      responses:
        "200":
          description: Like, comment, deletion or moderation persisted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoEngagement"}
  /humanitarian/config:
    get:
      operationId: getHumanitarianConfig
      tags: [humanitarian]
      responses:
        "200":
          description: Collection configuration
          content:
            application/json:
              schema:
                type: object
                required: [available, testMode, reason, collector, minimumUsd, minimumAed, documentaryUsd]
                properties:
                  available: {type: boolean}
                  testMode: {type: boolean}
                  reason: {type: string}
                  collector: {type: string}
                  minimumUsd: {type: integer}
                  minimumAed: {type: integer}
                  documentaryUsd: {type: integer, description: "Legacy field, always zero. Humanitarian films are free and separate from professional subscriptions."}
  /humanitarian/checkout:
    post:
      operationId: createHumanitarianCheckout
      tags: [humanitarian]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HumanitarianCheckoutInput"}
      responses:
        "200":
          description: One-time hosted checkout
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string}
        "400": {description: Invalid payment}
        "401": {description: Sign in for archive access}
        "503": {description: Collection is unavailable}
  /humanitarian/payment-status:
    get:
      operationId: getHumanitarianPaymentStatus
      tags: [humanitarian]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Verified processor status, never a client-side entitlement
          content:
            application/json:
              schema:
                type: object
                required: [status, archiveAccess]
                properties:
                  status: {type: string, enum: [pending, paid, refunded, expired]}
                  archiveAccess: {type: boolean}
        "404": {description: Payment not found}
  /humanitarian/offers:
    post:
      operationId: createHumanitarianOffer
      tags: [humanitarian]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HumanitarianOfferInput"}
      responses:
        "201":
          description: Offer received, no delivery promised
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: integer}
                  status: {type: string}
  /humanitarian/offers/admin:
    get:
      operationId: getHumanitarianOffers
      tags: [humanitarian]
      responses:
        "200":
          description: Founder-only contribution offers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, fullName, email, country, description, status, createdAt]
                  properties:
                    id: {type: integer}
                    kind: {type: string}
                    fullName: {type: string}
                    email: {type: string}
                    country: {type: string}
                    description: {type: string}
                    status: {type: string}
                    createdAt: {type: string}
  /humanitarian/offers/admin/{id}:
    patch:
      operationId: updateHumanitarianOffer
      tags: [humanitarian]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HumanitarianOfferStatusInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: integer}
                  status: {type: string}
  /documentary/access:
    get:
      operationId: getDocumentaryAccess
      tags: [humanitarian]
      responses:
        "200":
          description: Authenticated member's server-verified access
          content:
            application/json:
              schema:
                type: object
                required: [hasAccess, streamUrl]
                properties:
                  hasAccess: {type: boolean}
                  streamUrl: {type: ["string", "null"]}
        "401": {description: Sign in}
  /documentary/goma/stream:
    get:
      operationId: streamGomaDocumentary
      tags: [humanitarian]
      responses:
        "200":
          description: Protected complete film; byte ranges supported
          content:
            video/mp4:
              schema: {type: string, format: binary}
        "403": {description: Archive access required}
  /documentary/media/{filename}:
    get:
      operationId: getDocumentaryPreview
      tags: [humanitarian]
      parameters:
        - in: path
          name: filename
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Public preview, trailer or poster, never the protected film
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /news:
    get:
      operationId: getNewsArchive
      tags: [news]
      summary: Published coverage from TOMI's historical press archive
      responses:
        "200":
          description: Published articles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PressEntry"}
  /news/admin:
    get:
      operationId: getNewsAdmin
      tags: [news]
      summary: Founder-only published, draft and archived coverage
      responses:
        "200":
          description: Editorial entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PressEntry"}
        "403": {description: Founder access required}
    post:
      operationId: createNewsEntry
      tags: [news]
      summary: Founder creates coverage with explicit public image consent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PressEntryInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PressEntry"}
        "400": {description: Invalid entry}
        "403": {description: Founder access required}
  /news/admin/{id}:
    put:
      operationId: updateNewsEntry
      tags: [news]
      summary: Founder edits, publishes, unpublishes or archives coverage
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PressEntryInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PressEntry"}
        "403": {description: Founder access required}
        "404": {description: Entry not found}
  /news/{id}/assets/{asset}:
    get:
      operationId: getNewsAsset
      tags: [news]
      summary: Public evidence or logo of a published entry, private for drafts
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
        - in: path
          name: asset
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Image
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {description: Unavailable}
  /media-requests:
    post:
      operationId: createMediaRequest
      tags: [media]
      summary: Request a media placement for administrator review, never checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaInquiryInput"}
      responses:
        "201":
          description: Recorded for administrator review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaInquiryReceipt"}
        "400": {description: Invalid request}
        "429": {description: Too many requests}
    get:
      operationId: getMediaRequests
      tags: [media]
      summary: Founder-only media enquiry inbox
      responses:
        "200":
          description: Private requests
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MediaInquiry"}
        "403": {description: Founder access required}
  /media-requests/{id}:
    patch:
      operationId: updateMediaRequest
      tags: [media]
      summary: Founder-only review status, not a publication or payment confirmation
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaInquiryReview"}
      responses:
        "200":
          description: Review saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaInquiry"}
        "403": {description: Founder access required}
        "404": {description: Request not found}
  /community/profiles/{id}:
    get:
      operationId: getPublicNetworkProfile
      tags: [network]
      summary: Public opt-in ecosystem profile; no private identity, messages or posts
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Explicitly public, non-suspended member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkPublicProfileResponse"}
        "404": {description: Member not publicly listed}
  /network/state:
    get:
      operationId: getNetworkState
      tags: [network]
      summary: Verified-member network, scoped to session and optional selected profile or conversation
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: sector, in: query, schema: {type: string}}
        - {name: feed, in: query, schema: {type: string, enum: [all, following, business, reel]}}
        - {name: person, in: query, schema: {type: integer}}
        - {name: connections, in: query, schema: {type: string, enum: [followers, following]}}
        - {name: thread, in: query, schema: {type: integer}}
        - {name: before, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Network state with private conversations visible only to participants
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkState"}
        "401": {description: Sign in required}
        "403": {description: Verified email required or account suspended}
  /network/action:
    post:
      operationId: networkAction
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkActionInput"}
      responses:
        "200":
          description: Applied action
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkActionResult"}
        "400": {description: Invalid action}
        "403": {description: Forbidden action}
  /network/uploads:
    post:
      operationId: requestNetworkUpload
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkUploadInput"}
      responses:
        "200":
          description: Private upload registration and signed URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkUploadTicket"}
  /network/payments/status:
    get:
      operationId: getNetworkPaymentStatus
      tags: [network]
      parameters:
        - {name: sessionId, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Server-verified checkout status for this member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkPaymentStatus"}
  /donations:
    get:
      operationId: getDonationCampaign
      tags: [impact]
      responses:
        "200":
          description: Honest campaign readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DonationCampaign"}
  /member/profile:
    get:
      operationId: getMemberProfile
      tags: [member]
      summary: Get the signed-in member's private ecosystem profile
      responses:
        "200":
          description: Member profile or null before onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileResponse"
        "401":
          description: Sign-in required
    put:
      operationId: saveMemberProfile
      tags: [member]
      summary: Create or update only the authenticated member's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileInput"
      responses:
        "200":
          description: Saved private profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileResponse"
        "400":
          description: Invalid profile
        "401":
          description: Sign-in required
  /member/saved:
    post:
      operationId: toggleMemberSavedItem
      tags: [member]
      summary: Save or remove a programme or official resource from this member's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedItemInput"
      responses:
        "200":
          description: Updated private profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileResponse"
        "400":
          description: Invalid saved item
        "401":
          description: Sign-in required
        "409":
          description: Complete your profile first
  /ecosystem/members:
    get:
      operationId: getEcosystemMembers
      tags: [ecosystem]
      summary: Discover members who explicitly opted into the public showcase
      responses:
        "200":
          description: Public member-authored profiles, without private identity or saved items
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicMember"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Detailed health check
      description: Returns server health status and database connectivity
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealthStatus"
components:
  schemas:
    ProfessionalBusiness:
      type: object
      required: [memberId, name, website, status, attestationCount, hasAttested, decisionNote]
      properties:
        memberId: {type: integer}
        name: {type: string}
        website: {type: string}
        registrationReference: {type: string}
        status: {type: string}
        attestationCount: {type: integer}
        hasAttested: {type: boolean}
        decisionNote: {type: string}
        attestations:
          type: array
          items:
            type: object
            required: [id, memberId, name, statement]
            properties:
              id: {type: integer}
              memberId: {type: integer}
              name: {type: string}
              statement: {type: string}
    ProfessionalState:
      type: object
      required: [available, testMode, plans, membership, business, reviews, introductions, resources]
      properties:
        available: {type: boolean}
        testMode: {type: boolean}
        plans:
          type: array
          items:
            type: object
            required: [slug, name, amount, currency, interval]
            properties:
              slug: {type: string, enum: [professional, business]}
              name: {type: string}
              amount: {type: integer}
              currency: {type: string}
              interval: {type: string}
        membership:
          nullable: true
          type: object
          required: [tier, status, active, cancelAtPeriodEnd, currentPeriodEnd, testMode]
          properties:
            tier: {type: string}
            status: {type: string}
            active: {type: boolean}
            cancelAtPeriodEnd: {type: boolean}
            currentPeriodEnd: {type: string, nullable: true}
            testMode: {type: boolean}
        business:
          nullable: true
          allOf: [{$ref: "#/components/schemas/ProfessionalBusiness"}]
        reviews: {type: array, items: {$ref: "#/components/schemas/ProfessionalBusiness"}}
        introductions:
          type: array
          items:
            type: object
            required: [id, targetSlug, message, status, createdAt]
            properties:
              id: {type: integer}
              targetSlug: {type: string}
              message: {type: string}
              status: {type: string}
              memberName: {type: string}
              createdAt: {type: string}
        resources:
          type: array
          items:
            type: object
            required: [slug, title, description]
            properties:
              slug: {type: string}
              title: {type: string}
              description: {type: string}
    ProfessionalActionInput:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [checkout, cancel, portal, business.submit, business.attest, business.withdraw, business.review, introduction.status]}
        tier: {type: string, enum: [professional, business]}
        accepted: {type: boolean}
        id: {type: integer}
        memberId: {type: integer}
        name: {type: string, maxLength: 160}
        website: {type: string, maxLength: 300}
        registrationReference: {type: string, maxLength: 300}
        text: {type: string, maxLength: 2000}
        status: {type: string, maxLength: 40}
    ProfessionalIntroductionInput:
      type: object
      required: [targetSlug, message]
      properties:
        targetSlug: {type: string, maxLength: 90}
        message: {type: string, minLength: 20, maxLength: 2000}
    VideoEngagementInput:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [like, comment, delete, moderate]}
        accepted: {type: boolean}
        text: {type: string, minLength: 1, maxLength: 1500}
        id: {type: integer}
    VideoEngagement:
      type: object
      required: [likes, liked, comments]
      properties:
        likes: {type: integer}
        liked: {type: boolean}
        comments:
          type: array
          items:
            type: object
            required: [id, author, memberId, text, createdAt, canDelete]
            properties:
              id: {type: integer}
              author: {type: string}
              memberId: {type: integer}
              text: {type: string}
              createdAt: {type: string}
              canDelete: {type: boolean}
    HumanitarianCheckoutInput:
      type: object
      required: [kind, amount, currency, accepted, requestId]
      properties:
        kind: {type: string, enum: [donation, documentary], description: "Use donation. Legacy documentary purchases are retired and return HTTP 410."}
        amount: {type: integer, minimum: 100}
        currency: {type: string, enum: [usd, aed]}
        accepted: {type: boolean}
        requestId: {type: string, minLength: 16, maxLength: 80}
    HumanitarianOfferInput:
      type: object
      required: [kind, fullName, email, country, description, accepted]
      properties:
        kind: {type: string, enum: [goods, equipment, logistics, financial]}
        fullName: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, minLength: 3, maxLength: 254}
        country: {type: string, minLength: 2, maxLength: 90}
        description: {type: string, minLength: 20, maxLength: 3000}
        accepted: {type: boolean}
        website: {type: string, maxLength: 200}
    HumanitarianOfferStatusInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [new, contacted, arranged, closed]}
    PressEntryInput:
      type: object
      required: [title, outlet, summary, category, dateLabel, sourceUrl, websiteUrl, status, evidenceUploadIds, removeEvidenceIndexes, removeLogo, publicAssetsConsent]
      properties:
        title: {type: string, minLength: 2, maxLength: 240}
        outlet: {type: string, minLength: 2, maxLength: 120}
        summary: {type: string, minLength: 10, maxLength: 1800}
        category: {type: string, enum: [movement, founder, editions, humanitarian]}
        dateLabel: {type: string, maxLength: 80}
        sourceUrl: {type: string, maxLength: 2000}
        websiteUrl: {type: string, minLength: 8, maxLength: 2000}
        status: {type: string, enum: [draft, published, archived]}
        evidenceUploadIds:
          type: array
          maxItems: 12
          items: {type: string, maxLength: 80}
        removeEvidenceIndexes:
          type: array
          maxItems: 12
          items: {type: integer, minimum: 0, maximum: 11}
        logoUploadId: {type: string, maxLength: 80}
        removeLogo: {type: boolean}
        publicAssetsConsent: {type: boolean}
    PressEntry:
      type: object
      required: [id, title, outlet, summary, category, dateLabel, sourceUrl, websiteUrl, status, evidenceUrls, logoUrl]
      properties:
        id: {type: integer}
        title: {type: string}
        outlet: {type: string}
        summary: {type: string}
        category: {type: string, enum: [movement, founder, editions, humanitarian]}
        dateLabel: {type: string}
        sourceUrl: {type: string}
        websiteUrl: {type: string}
        status: {type: string, enum: [draft, published, archived]}
        evidenceUrls:
          type: array
          items: {type: string}
        logoUrl: {type: ["string", "null"]}
    MediaInquiryInput:
      type: object
      required: [outletId, format, contactName, email, organizationName, country, message, consentAccepted]
      properties:
        outletId: {type: string, minLength: 1, maxLength: 30}
        format: {type: string, minLength: 1, maxLength: 30}
        contactName: {type: string, minLength: 1, maxLength: 120}
        email: {type: string, minLength: 3, maxLength: 254}
        organizationName: {type: string, minLength: 1, maxLength: 160}
        country: {type: string, minLength: 1, maxLength: 90}
        message: {type: string, minLength: 10, maxLength: 800}
        consentAccepted: {type: boolean}
        website: {type: string, maxLength: 200, description: Honeypot; must be blank}
    MediaInquiryReceipt:
      type: object
      required: [id, status]
      properties:
        id: {type: integer}
        status: {type: string}
    MediaInquiryReview:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [new, in_progress, approved, declined, closed]}
    MediaInquiry:
      type: object
      required: [id, outletId, outletName, format, contactName, email, organizationName, country, message, status, createdAt]
      properties:
        id: {type: integer}
        outletId: {type: string}
        outletName: {type: string}
        format: {type: string}
        contactName: {type: string}
        email: {type: string}
        organizationName: {type: string}
        country: {type: string}
        message: {type: string}
        status: {type: string}
        createdAt: {type: string}
    NetworkActionInput:
