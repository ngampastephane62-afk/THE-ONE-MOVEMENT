        "200":
          description: Public member-authored profiles, without private identity or saved items
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicMember"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Detailed health check
      description: Returns server health status and database connectivity
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealthStatus"
components:
  schemas:
    MembershipAccount:
      type: object
      required: [clerkId, name, email, emailVerified, createdAt, lastSignInAt, profileStatus, missingFields, sectors, networkEnabled, suspended, lastReminderAt, reminderStatus, remindersOptedOut]
      properties:
        clerkId: { type: string }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        createdAt: { type: string }
        lastSignInAt: { type: [string, 'null'] }
        profileStatus: { type: string, enum: [no_profile, incomplete, complete] }
        missingFields: { type: array, items: { type: string } }
        sectors: { type: array, items: { type: string } }
        networkEnabled: { type: boolean }
        suspended: { type: boolean }
        lastReminderAt: { type: [string, 'null'] }
        reminderStatus: { type: [string, 'null'] }
        remindersOptedOut: { type: boolean }
    MembershipDashboard:
      type: object
      required: [refreshedAt, environment, totals, accounts, page, pages, filteredCount, traffic, emailSetup]
      properties:
        refreshedAt: { type: string }
        environment: { type: string, enum: [development, production] }
        totals:
          type: object
          required: [accounts, noProfile, incomplete, complete, active]
          properties:
            accounts: { type: integer }
            noProfile: { type: integer }
            incomplete: { type: integer }
            complete: { type: integer }
            active: { type: integer }
        accounts: { type: array, items: { $ref: '#/components/schemas/MembershipAccount' } }
        page: { type: integer }
        pages: { type: integer }
        filteredCount: { type: integer }
        emailSetup:
          type: object
          required: [configured, message]
          properties:
            configured: { type: boolean }
            message: { type: string }
        traffic:
          type: object
          required: [days, sessions, pageViews, measurementStartedAt, daily]
          properties:
            days: { type: integer }
            sessions: { type: integer }
            pageViews: { type: integer }
            measurementStartedAt: { type: [string, 'null'] }
            daily:
              type: array
              items:
                type: object
                required: [day, sessions, pageViews]
                properties:
                  day: { type: string }
                  sessions: { type: integer }
                  pageViews: { type: integer }
    ProfileReminderPreview:
      type: object
      required: [clerkId, recipient, senderDomain, domainVerification, subject, text, canSend, reason, previewToken]
      properties:
        clerkId: { type: string }
        recipient: { type: string }
        senderDomain: { type: string }
        domainVerification: { type: string, enum: [verified, manual_check, unavailable] }
        subject: { type: string }
        text: { type: string }
        canSend: { type: boolean }
        reason: { type: string }
        previewToken: { type: string }
    SendProfileReminderInput:
      type: object
      additionalProperties: false
      required: [confirmed, previewToken, domainVerifiedByFounder]
      properties:
        confirmed: { type: boolean, const: true }
        previewToken: { type: string, maxLength: 200 }
        domainVerifiedByFounder: { type: boolean }
    SiteVisitInput:
      type: object
      additionalProperties: false
      required: [sessionId, consent]
      properties:
        sessionId: { type: string, pattern: '^[a-fA-F0-9-]{36}$', maxLength: 36 }
        consent: { type: boolean, const: true }
    HomeEditorial:
      type: object
      required: [updatedAt, status, sections]
      properties:
        updatedAt: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published] }
        sections:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/HomeSection' }
    HomeEditorialInput:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, content]
      properties:
        expectedUpdatedAt: { type: [string, 'null'] }
        content: { $ref: '#/components/schemas/HomeEditorial' }
    HomeSection:
      type: object
      additionalProperties: false
      required: [id, type, enabled, layout, theme, alignment, spacing, fields, media]
      properties:
        id: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        type: { type: string, enum: [hero, universe, programmes, movement, origin, archive, paths, join, custom] }
        enabled: { type: boolean }
        layout: { type: string, enum: [original, stack, media-left, media-right] }
        theme: { type: string, enum: [original, ivory, lagoon] }
        alignment: { type: string, enum: [left, center] }
        spacing: { type: string, enum: [compact, normal, large] }
        fields:
          type: object
          maxProperties: 100
          additionalProperties: { type: string, maxLength: 5000 }
        media:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/HomeMedia' }
    HomeMedia:
      type: object
      additionalProperties: false
      required: [key, uploadId, kind, url, alt, credit, rightsConfirmed]
      properties:
        key: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-zA-Z][a-zA-Z0-9-]*$' }
        uploadId: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        kind: { type: string, enum: [image, video] }
        url: { type: [string, 'null'], maxLength: 1000 }
        alt: { type: string, maxLength: 500 }
        credit: { type: string, maxLength: 500 }
        rightsConfirmed: { type: boolean }
    ProgramVideo:
      type: object
      required: [id, title, description, credit, uploadId, assetKey, url, published, rightsConfirmed, order]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        credit: { type: string, maxLength: 300 }
        uploadId: { type: [string, 'null'] }
        assetKey: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        published: { type: boolean }
        rightsConfirmed: { type: boolean }
        order: { type: integer, minimum: 0, maximum: 10000 }
    ProgramPerson:
      type: object
      required: [id, name, designation, biography, kind, confirmed, published, portraitKey, portraitUploadId, portraitUrl, profileUrl, order, videos]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        designation: { type: string, maxLength: 200 }
        biography: { type: string, maxLength: 3000 }
        kind: { type: string, enum: [nominee, speaker, participant] }
        confirmed: { type: boolean }
        published: { type: boolean }
        portraitKey: { type: [string, 'null'] }
        portraitUploadId: { type: [string, 'null'] }
        portraitUrl: { type: [string, 'null'] }
        profileUrl: { type: [string, 'null'], maxLength: 500 }
        order: { type: integer, minimum: 0, maximum: 10000 }
        videos:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ProgramVideo' }
    ProgramEditorial:
      type: object
      required: [slug, updatedAt, status, introduction, description, purpose, criteria, heroVideoUploadId, heroImageUploadId, heroVideoUrl, heroImageUrl, eventDate, venue, eventDetailsConfirmed, announcement, participationRoles, people, media]
      properties:
        slug: { type: string }
        updatedAt: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published] }
        introduction: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 4000 }
        purpose: { type: string, maxLength: 3000 }
        criteria: { type: string, maxLength: 6000 }
        heroVideoUploadId: { type: [string, 'null'] }
        heroImageUploadId: { type: [string, 'null'] }
        heroVideoUrl: { type: [string, 'null'] }
        heroImageUrl: { type: [string, 'null'] }
        eventDate: { type: [string, 'null'], maxLength: 100 }
        venue: { type: string, maxLength: 300 }
        eventDetailsConfirmed: { type: boolean }
