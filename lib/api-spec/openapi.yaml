        text: {type: string}
        kind: {type: string}
        media: {type: array, items: {$ref: "#/components/schemas/NetworkMedia"}}
        likes: {type: integer}
        views: {type: integer}
        liked: {type: boolean}
        comments: {type: array, items: {$ref: "#/components/schemas/NetworkComment"}}
