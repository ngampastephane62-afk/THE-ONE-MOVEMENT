            followers: {type: integer}
            following: {type: integer}
            followed: {type: boolean}
            blocked: {type: boolean}
            suspended: {type: boolean}
            badges: {type: array, items: {$ref: "#/components/schemas/NetworkBadge"}}
    NetworkComment:
