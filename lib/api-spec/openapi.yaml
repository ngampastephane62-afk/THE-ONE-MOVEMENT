      type: object
      required: [me, founder, members, posts, nextCursor, person, threads, messages, certifications, reports, packages, documents, stripeReady, growth]
      properties:
        growth: {anyOf: [{$ref: "#/components/schemas/NetworkGrowth"}, {type: "null"}]}
        me: {anyOf: [{$ref: "#/components/schemas/NetworkMember"}, {type: "null"}]}
        founder: {anyOf: [{$ref: "#/components/schemas/NetworkMember"}, {type: "null"}]}
        members: {type: array, items: {$ref: "#/components/schemas/NetworkMember"}}
        posts: {type: array, items: {$ref: "#/components/schemas/NetworkPost"}}
        nextCursor: {type: [integer, "null"]}
        person: {anyOf: [{$ref: "#/components/schemas/NetworkMember"}, {type: "null"}]}
        threads: {type: array, items: {$ref: "#/components/schemas/NetworkThread"}}
        messages: {type: array, items: {$ref: "#/components/schemas/NetworkMessage"}}
        certifications: {type: array, items: {$ref: "#/components/schemas/NetworkCertification"}}
