openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /community/profiles/{id}:
    get:
      operationId: getPublicNetworkProfile
      tags: [network]
      summary: Public opt-in ecosystem profile; no private identity, messages or posts
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Explicitly public, non-suspended member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkPublicProfileResponse"}
        "404": {description: Member not publicly listed}
  /network/state:
    get:
      operationId: getNetworkState
      tags: [network]
      summary: Verified-member network, scoped to session and optional selected profile or conversation
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: sector, in: query, schema: {type: string}}
        - {name: feed, in: query, schema: {type: string, enum: [all, following, business, reel]}}
        - {name: person, in: query, schema: {type: integer}}
        - {name: connections, in: query, schema: {type: string, enum: [followers, following]}}
        - {name: thread, in: query, schema: {type: integer}}
        - {name: before, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Network state with private conversations visible only to participants
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkState"}
        "401": {description: Sign in required}
        "403": {description: Verified email required or account suspended}
  /network/action:
    post:
      operationId: networkAction
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkActionInput"}
      responses:
        "200":
          description: Applied action
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkActionResult"}
        "400": {description: Invalid action}
        "403": {description: Forbidden action}
  /network/uploads:
    post:
      operationId: requestNetworkUpload
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkUploadInput"}
      responses:
        "200":
          description: Private upload registration and signed URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkUploadTicket"}
  /network/payments/status:
    get:
      operationId: getNetworkPaymentStatus
      tags: [network]
      parameters:
        - {name: sessionId, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Server-verified checkout status for this member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkPaymentStatus"}
  /donations:
    get:
      operationId: getDonationCampaign
      tags: [impact]
      responses:
        "200":
          description: Honest campaign readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DonationCampaign"}
  /member/profile:
    get:
      operationId: getMemberProfile
      tags: [member]
      summary: Get the signed-in member's private ecosystem profile
      responses:
        "200":
          description: Member profile or null before onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileResponse"
        "401":
          description: Sign-in required
    put:
      operationId: saveMemberProfile
      tags: [member]
      summary: Create or update only the authenticated member's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileInput"
      responses:
        "200":
          description: Saved private profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileResponse"
        "400":
          description: Invalid profile
        "401":
          description: Sign-in required
  /member/saved:
    post:
      operationId: toggleMemberSavedItem
      tags: [member]
      summary: Save or remove a programme or official resource from this member's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedItemInput"
      responses:
        "200":
          description: Updated private profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileResponse"
        "400":
          description: Invalid saved item
        "401":
          description: Sign-in required
        "409":
          description: Complete your profile first
  /ecosystem/members:
    get:
      operationId: getEcosystemMembers
      tags: [ecosystem]
      summary: Discover members who explicitly opted into the public showcase
      responses:
        "200":
          description: Public member-authored profiles, without private identity or saved items
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicMember"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Detailed health check
      description: Returns server health status and database connectivity
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealthStatus"
components:
  schemas:
    NetworkActionInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [join, referral.claim, post.create, post.edit, post.delete, post.like, post.view, comment.create, comment.delete, follow, block, thread.start, thread.accept, thread.decline, message.send, message.read, upload.complete, profile.media, certification.request, certification.decide, report, moderate.post, moderate.member, report.resolve, checkout]}
        id: {type: integer}
        targetId: {type: integer}
        text: {type: string, maxLength: 5000}
        kind: {type: string}
        mediaIds: {type: array, maxItems: 6, items: {type: string}}
        role: {type: string}
        program: {type: string}
        packageSlug: {type: string}
        decision: {type: string}
        accepted: {type: boolean}
        agreementConfirmed: {type: boolean}
        paymentConfirmed: {type: boolean}
    NetworkActionResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        id: {type: integer}
        url: {type: string}
    NetworkUploadInput:
      type: object
      additionalProperties: false
      required: [filename, contentType, size]
      properties:
        filename: {type: string, maxLength: 200}
        contentType: {type: string}
        size: {type: integer, minimum: 1, maximum: 104857600}
    NetworkUploadTicket:
      type: object
      required: [id, uploadUrl]
      properties:
        id: {type: string}
        uploadUrl: {type: string}
    NetworkMedia:
      type: object
      required: [id, url, filename, contentType]
      properties:
        id: {type: string}
        url: {type: string}
        filename: {type: string}
        contentType: {type: string}
    NetworkBadge:
      type: object
      required: [role, program, expiresAt]
      properties:
        role: {type: string}
        program: {type: string}
        expiresAt: {type: [string, "null"]}
    NetworkMember:
      allOf:
        - {$ref: "#/components/schemas/PublicMember"}
        - type: object
          required: [enabled, founder, avatarUrl, coverUrl, followers, following, followed, blocked, badges, suspended]
          properties:
            enabled: {type: boolean}
            founder: {type: boolean}
            avatarUrl: {type: [string, "null"]}
            coverUrl: {type: [string, "null"]}
            followers: {type: integer}
            following: {type: integer}
            followed: {type: boolean}
            blocked: {type: boolean}
            suspended: {type: boolean}
            badges: {type: array, items: {$ref: "#/components/schemas/NetworkBadge"}}
    NetworkComment:
      type: object
      required: [id, author, text, createdAt]
      properties:
        id: {type: integer}
        author: {$ref: "#/components/schemas/NetworkMember"}
        text: {type: string}
        createdAt: {type: string}
    NetworkPost:
      type: object
      required: [id, author, text, kind, media, likes, views, liked, comments, createdAt, edited]
      properties:
        id: {type: integer}
        author: {$ref: "#/components/schemas/NetworkMember"}
        text: {type: string}
        kind: {type: string}
        media: {type: array, items: {$ref: "#/components/schemas/NetworkMedia"}}
        likes: {type: integer}
        views: {type: integer}
        liked: {type: boolean}
        comments: {type: array, items: {$ref: "#/components/schemas/NetworkComment"}}
        createdAt: {type: string}
        edited: {type: boolean}
    NetworkThread:
      type: object
      required: [id, other, accepted, declined, requestedByMe, lastMessage, unread, updatedAt]
      properties:
        id: {type: integer}
        other: {$ref: "#/components/schemas/NetworkMember"}
        accepted: {type: boolean}
        declined: {type: boolean}
        requestedByMe: {type: boolean}
        lastMessage: {type: string}
        unread: {type: integer}
        updatedAt: {type: string}
    NetworkMessage:
      type: object
      required: [id, senderId, text, read, createdAt]
      properties:
        id: {type: integer}
        senderId: {type: integer}
        text: {type: string}
        read: {type: boolean}
        createdAt: {type: string}
    NetworkCertification:
      type: object
      required: [id, member, role, program, packageSlug, note, evidence, status, decisionNote, agreementConfirmed, paymentConfirmed, createdAt, expiresAt]
      properties:
        id: {type: integer}
        member: {$ref: "#/components/schemas/NetworkMember"}
        role: {type: string}
        program: {type: string}
        packageSlug: {type: string}
        note: {type: string}
        evidence: {type: array, items: {$ref: "#/components/schemas/NetworkMedia"}}
        status: {type: string}
        decisionNote: {type: string}
        agreementConfirmed: {type: boolean}
        paymentConfirmed: {type: boolean}
        createdAt: {type: string}
        expiresAt: {type: [string, "null"]}
    NetworkPackage:
      type: object
      required: [slug, name, audience, amount, currency, durationMonths, documentSlug, payable]
      properties:
        slug: {type: string}
        name: {type: string}
        audience: {type: string}
        amount: {type: [integer, "null"]}
        currency: {type: string}
        durationMonths: {type: integer}
        documentSlug: {type: string}
        payable: {type: boolean}
    NetworkDocument:
      type: object
      required: [slug, title, url, restricted, accessible]
      properties:
        slug: {type: string}
        title: {type: string}
        url: {type: string}
        restricted: {type: boolean}
        accessible: {type: boolean}
    NetworkReport:
      type: object
      required: [id, reporter, postId, memberId, reason, resolved]
      properties:
        id: {type: integer}
        reporter: {type: string}
        postId: {type: [integer, "null"]}
        memberId: {type: [integer, "null"]}
        reason: {type: string}
        resolved: {type: boolean}
    NetworkPaymentStatus:
      type: object
      required: [status, certificationId]
      properties:
        status: {type: string}
        certificationId: {type: integer}
    DonationCampaign:
      type: object
      required: [title, description, collector, beneficiary, active, reason, currency]
      properties:
        title: {type: string}
        description: {type: string}
        collector: {type: string}
        beneficiary: {type: [string, "null"]}
        active: {type: boolean}
        reason: {type: string}
        currency: {type: string}
    NetworkState:
      type: object
      required: [me, founder, members, posts, nextCursor, person, threads, messages, certifications, reports, packages, documents, stripeReady, growth]
      properties:
        growth: {anyOf: [{$ref: "#/components/schemas/NetworkGrowth"}, {type: "null"}]}
        me: {anyOf: [{$ref: "#/components/schemas/NetworkMember"}, {type: "null"}]}
        founder: {anyOf: [{$ref: "#/components/schemas/NetworkMember"}, {type: "null"}]}
        members: {type: array, items: {$ref: "#/components/schemas/NetworkMember"}}
        posts: {type: array, items: {$ref: "#/components/schemas/NetworkPost"}}
        nextCursor: {type: [integer, "null"]}
        person: {anyOf: [{$ref: "#/components/schemas/NetworkMember"}, {type: "null"}]}
        threads: {type: array, items: {$ref: "#/components/schemas/NetworkThread"}}
        messages: {type: array, items: {$ref: "#/components/schemas/NetworkMessage"}}
        certifications: {type: array, items: {$ref: "#/components/schemas/NetworkCertification"}}
        reports: {type: array, items: {$ref: "#/components/schemas/NetworkReport"}}
        packages: {type: array, items: {$ref: "#/components/schemas/NetworkPackage"}}
        documents: {type: array, items: {$ref: "#/components/schemas/NetworkDocument"}}
        stripeReady: {type: boolean}
    NetworkGrowth:
      type: object
      required: [inviteCode, qualifiedInvites, requiredInvites, canPost]
      properties:
        inviteCode: {type: string}
        qualifiedInvites: {type: integer}
        requiredInvites: {type: integer}
        canPost: {type: boolean}
    NetworkPublicProfileResponse:
      type: object
      required: [profile]
      properties:
        profile: {$ref: "#/components/schemas/NetworkMember"}
    SavedItemInput:
      type: object
      additionalProperties: false
      required: [itemId, saved]
      properties:
        itemId:
          type: string
          maxLength: 100
        saved:
          type: boolean
    MemberProfileInput:
      type: object
      additionalProperties: false
      required: [fullName, profession, organization, country, bio, offering, lookingFor, website, sectors, isPublic]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        profession:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 150
        country:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
        offering:
          type: string
          maxLength: 500
        lookingFor:
          type: string
          maxLength: 500
        website:
          type: string
          maxLength: 500
        sectors:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [fashion, music, dance, film, art, business, investment, tourism, diplomacy, innovation, technology, ngos, media, education, humanitarian-action, real-estate, health-care]
        isPublic:
          type: boolean
        publicMedia:
          type: boolean
    PublicMember:
      allOf:
        - $ref: "#/components/schemas/MemberProfileInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    MemberProfile:
      allOf:
        - $ref: "#/components/schemas/PublicMember"
        - type: object
          required: [savedItems, publicMedia]
          properties:
            publicMedia:
              type: boolean
            savedItems:
              type: array
              items:
                type: string
    MemberProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/MemberProfile"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DetailedHealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
        - status
        - database

