openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /founder/membership-dashboard:
    get:
      operationId: getMembershipDashboard
      tags: [MembershipDashboard]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [all, no_profile, incomplete, complete, active], default: all } }
        - { in: query, name: days, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        '200':
          description: Founder-only account and consent-based traffic statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipDashboard' }
  /founder/profile-reminders/{clerkId}:
    parameters:
      - { in: path, name: clerkId, required: true, schema: { type: string, maxLength: 100 } }
    get:
      operationId: previewProfileReminder
      tags: [MembershipDashboard]
      responses:
        '200':
          description: Fresh eligibility and exact proposed email; does not send.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileReminderPreview' }
    post:
      operationId: sendProfileReminder
      tags: [MembershipDashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendProfileReminderInput' }
      responses:
        '200':
          description: Provider accepted the reminder, not proof of delivery.
          content:
            application/json:
              schema:
                type: object
                required: [status, acceptedAt]
                properties:
                  status: { type: string, enum: [accepted] }
                  acceptedAt: { type: string }
  /site-visits:
    post:
      operationId: recordSiteVisit
      tags: [MembershipDashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitInput' }
      responses:
        '204': { description: Consented anonymous page view recorded. }
  /home-editorial:
    get:
      operationId: getHomeEditorial
      tags: [HomeEditorial]
      responses:
        '200':
          description: Published homepage only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeEditorial' }
  /founder/home-editorial:
    get:
      operationId: getFounderHomeEditorial
      tags: [HomeEditorial]
      responses:
        '200':
          description: Founder-only homepage draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeEditorial' }
    put:
      operationId: saveHomeEditorial
      tags: [HomeEditorial]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeEditorialInput' }
      responses:
        '200':
          description: Saved draft or explicitly published homepage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeEditorial' }
        '409':
          description: Revision conflict; no changes applied.
  /program-editorial/{slug}:
    get:
      operationId: getProgramEditorial
      tags: [ProgramEditorial]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published programme editorial content only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEditorial' }
  /founder/program-editorial/{slug}:
    get:
      operationId: getFounderProgramEditorial
      tags: [ProgramEditorial]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Founder draft and revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEditorial' }
    put:
      operationId: saveProgramEditorial
      tags: [ProgramEditorial]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramEditorialSave' }
      responses:
        '200':
          description: Saved draft or explicitly published changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEditorial' }
  /founder/program-editorial/{slug}/inquiries:
    get:
      operationId: getProgramInquiries
      tags: [ProgramEditorial]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Programme-specific inquiries, newest first, maximum 100.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProgramInquiry' }
  /partner-directory:
    get:
      operationId: getPartnerDirectory
      tags: [PartnerDirectory]
      responses:
        '200':
          description: Approved public organizations and page copy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerDirectoryResponse' }
  /founder/partner-directory:
    get:
      operationId: getAdminPartnerDirectory
      tags: [PartnerDirectory]
      responses:
        '200':
          description: Founder organization records including review drafts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerDirectoryResponse' }
    post:
      operationId: createPartnerOrganization
      tags: [PartnerDirectory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerOrganizationSave' }
      responses:
        '201':
          description: Organization saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerOrganization' }
  /founder/partner-directory/content:
    put:
      operationId: updatePartnerPageContent
      tags: [PartnerDirectory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerPageContentSave' }
      responses:
        '200':
          description: Partner page copy saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerPageContent' }
  /founder/partner-directory/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 100 } }
    put:
      operationId: updatePartnerOrganization
      tags: [PartnerDirectory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerOrganizationSave' }
      responses:
        '200':
          description: Organization saved; stale edits return 409.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerOrganization' }
    delete:
      operationId: deletePartnerOrganization
      tags: [PartnerDirectory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerOrganizationDelete' }
      responses:
        '204': { description: Entry removed from display; records and files retained. }
  /partner-directory/{id}/logo:
    get:
      operationId: getPartnerOrganizationLogo
      tags: [PartnerDirectory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Publication-scoped organization image. }
  /media-center:
    get:
      operationId: getMediaPublications
      tags: [MediaCenter]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Published press and media publications, editorial order first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPublicationPage' }
  /founder/media-center:
    get:
      operationId: getAdminMediaPublications
      tags: [MediaCenter]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Authorized Founder publication management.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPublicationPage' }
    post:
      operationId: createMediaPublication
      tags: [MediaCenter]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaPublicationSave' }
      responses:
        '201':
          description: Publication saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPublication' }
  /founder/media-center/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateMediaPublication
      tags: [MediaCenter]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaPublicationSave' }
      responses:
        '200':
          description: Publication saved; stale revisions return 409.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPublication' }
    delete:
      operationId: deleteMediaPublication
      tags: [MediaCenter]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaPublicationDelete' }
      responses:
        '204':
          description: Removed from active publications; underlying media retained.
  /media-center/{id}/assets/{slot}:
    get:
      operationId: getMediaPublicationAsset
      tags: [MediaCenter]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: slot, in: path, required: true, schema: { type: string, enum: [cover, logo] } }
      responses:
        '200':
          description: Publication image; unpublished images require Founder access.
          content:
            image/webp:
              schema: { type: string, format: binary }
  /gratitude/options:
    get:
      operationId: getGratitudeOptions
      responses:
        "200":
          description: Active campaigns and international country/theme choices
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GratitudeOptions"}
  /gratitude/stories:
    get:
      operationId: getGratitudeStories
      parameters:
        - {name: country, in: query, schema: {type: string}}
        - {name: continent, in: query, schema: {type: string}}
        - {name: campaign, in: query, schema: {type: integer}}
        - {name: author, in: query, schema: {type: integer}}
        - {name: sort, in: query, schema: {type: string, enum: [recent, views, likes, discussed, featured], default: recent}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        "200":
          description: Approved and privacy-eligible public stories
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GratitudePage"}
  /gratitude/stories/{id}:
    get:
      operationId: getGratitudeStory
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Public story with visible comments
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GratitudeStory"}
  /gratitude/me:
    get:
      operationId: getMyGratitudeStories
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        "200":
          description: Current member's private drafts and statuses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GratitudePage"}
  /gratitude/founder:
    get:
      operationId: getFounderGratitude
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        "200":
          description: Founder-only stories, campaigns and open reports
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GratitudeFounder"}
  /gratitude/review/{id}:
    get:
      operationId: getFounderGratitudeStory
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Founder-only story and comments for moderation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GratitudeStory"}
  /gratitude/actions:
    post:
      operationId: runGratitudeAction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GratitudeAction"}
      responses:
        "200":
          description: Committed action; refetch affected gratitude queries
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: integer}
  /gratitude/uploads:
    post:
      operationId: requestGratitudeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GratitudeUploadInput"}
      responses:
        "201":
          description: Private upload reservation
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadUrl, version]
                properties:
                  id: {type: string}
                  uploadUrl: {type: string}
                  version: {type: integer}
  /gratitude/uploads/{id}/complete:
    post:
      operationId: completeGratitudeUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Validated media or explicit processing error
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string}
  /gratitude/media/{id}:
    get:
      operationId: getGratitudeMedia
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "Authorized media stream, with byte ranges for videos"}
        "404": {description: Media unavailable or not authorized}
  /news/articles:
    get:
      operationId: getPublishedNewsArticles
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        "200":
          description: Published editorial articles
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NewsPublicPage"}
  /news/articles/{slug}:
    get:
      operationId: getPublishedNewsArticle
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Current published revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NewsPublicArticle"}
        "404": {description: Article not found}
  /founder/news:
    get:
      operationId: getFounderNews
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        "200":
          description: Private management list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NewsFounderPage"}
  /founder/news/options:
    get:
      operationId: getFounderNewsOptions
      responses:
        "200":
          description: Existing catalogue references
          content:
            application/json:
              schema:
                type: object
                required: [partners, programmes]
                properties:
                  partners: {type: array, items: {$ref: "#/components/schemas/NewsReference"}}
                  programmes: {type: array, items: {$ref: "#/components/schemas/NewsReference"}}
  /founder/news/{id}:
    get:
      operationId: getFounderNewsArticle
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: historyPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        "200":
          description: Private draft and revision history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NewsFounderArticle"}
  /founder/news/actions:
    post:
      operationId: runFounderNewsAction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewsActionInput"}
      responses:
        "200":
          description: Committed article state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NewsFounderArticle"}
        "409": {description: Version conflict or reserved slug}
  /founder/news/uploads:
    post:
      operationId: requestFounderNewsUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewsUploadInput"}
      responses:
        "201":
          description: Private editorial upload
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadUrl]
                properties:
                  id: {type: string}
                  uploadUrl: {type: string}
  /founder/news/uploads/{uploadId}/complete:
    post:
      operationId: completeFounderNewsUpload
      parameters:
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Upload verified
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string}
  /magazine/statistics:
    get:
      operationId: getMagazineStatistics
      responses:
        "200":
          description: Real reader activity measured since collection began; sessions are not unique people
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MagazineStatistics"}
  /magazine/reading-events:
    post:
      operationId: recordMagazineReadingEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MagazineReadingInput"}
      responses:
        "200":
          description: Event accepted idempotently
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: {type: boolean}
        "400": {description: Invalid reading event}
        "429": {description: Too many requests}
  /partner-introductions:
    post:
      operationId: createPartnerIntroduction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartnerIntroductionInput"}
      responses:
        "201":
          description: Recorded for TOMI, not sent to the partner
          content:
            application/json:
              schema:
                type: object
                required: [id, status, message]
                properties:
                  id: {type: integer}
                  status: {type: string}
                  message: {type: string}
        "400": {description: Invalid request}
        "429": {description: Request limit reached}
    get:
      operationId: getPartnerIntroductions
      responses:
        "200":
          description: Founder-only introduction inbox
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PartnerIntroduction"}}
        "403": {description: Founder access required}
  /partner-introductions/{id}:
    patch:
      operationId: updatePartnerIntroduction
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartnerIntroductionStatusInput"}
      responses:
        "200":
          description: Updated review status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PartnerIntroduction"}
        "403": {description: Founder access required}
  /editorial/media/engagement:
    get:
      operationId: getMediaEngagement
      parameters:
        - {name: source, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Public photograph likes and visible comments
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoEngagement"}
        "404": {description: Photograph is not a registered public resource}
    post:
      operationId: updateMediaEngagement
      parameters:
        - {name: source, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoEngagementInput"}
      responses:
        "200":
          description: Persisted photograph action; authenticated eligible member required
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoEngagement"}
        "403": {description: Membership or same-origin permission required}
  /magazine/kit.pdf:
    get:
      operationId: downloadMagazineKit
      responses:
        "200":
          description: Free public presentation/media kit, distinct from a reader edition
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /magazine/submissions:
    get:
      operationId: getMagazineSubmissions
      responses:
        "200":
          description: Own private article proposals and Founder flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineSubmissionList" }
    post:
      operationId: createMagazineSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagazineSubmissionInput" }
      responses:
        "201":
          description: Private proposal saved at server-owned USD200 price; no charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineSubmission" }
  /magazine/submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateMagazineSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagazineSubmissionInput" }
      responses:
        "200":
          description: Updated own unpaid proposal, returned to editorial review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineSubmission" }
    delete:
      operationId: withdrawMagazineSubmission
      responses:
        "204": { description: "Unpaid proposal withdrawn, audit record retained" }
  /magazine/admin/submissions:
    get:
      operationId: getMagazineAdminSubmissions
      responses:
        "200":
          description: Founder-only article proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MagazineSubmission" }
  /magazine/admin/submissions/{id}:
    patch:
      operationId: reviewMagazineSubmission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagazineSubmissionReviewInput" }
      responses:
        "200":
          description: Founder decision; approval requires publication terms and never marks a payment paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineSubmission" }
  /magazine/config:
    get:
      operationId: getMagazineConfig
      responses:
        "200":
          description: Retail prices and actual payment availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineConfig" }
  /magazine/orders:
    get:
      operationId: getMagazineOrders
      responses:
        "200":
          description: Authenticated reader's own orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineOrderList" }
    post:
      operationId: createMagazineOrder
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagazineOrderInput" }
      responses:
        "409":
          description: The presentation kit is free; reader-edition checkout is closed until a separate edition is supplied
        "201":
          description: Legacy reader-order response contract, retained for existing clients; new kit purchases are closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineOrder" }
  /magazine/orders/{id}:
    get:
      operationId: getMagazineOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Own order with server-verified payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineOrder" }
  /magazine/orders/{id}/checkout:
    post:
      operationId: checkoutMagazineOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagazineCheckoutInput" }
      responses:
        "200":
          description: Stripe-hosted one-time checkout at the server-owned price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagazineCheckoutReply" }
  /magazine/orders/{id}/download:
    get:
      operationId: downloadMagazineOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: PDF for its verified paying reader only
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /magazine/admin/orders:
    get:
      operationId: getMagazineAdminOrders
      responses:
        "200":
          description: Founder-only print fulfilment and order list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MagazineOrder" }
  /magazine/admin/orders/{id}/quote:
    patch:
      operationId: quoteMagazineShipping
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
