      type: object
      additionalProperties: false
      required: [itemId, saved]
      properties:
        itemId:
          type: string
          maxLength: 100
        saved:
          type: boolean
    MemberProfileInput:
      type: object
      additionalProperties: false
      required: [fullName, profession, organization, country, bio, offering, lookingFor, website, sectors, isPublic]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        profession:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 150
        country:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
        offering:
          type: string
          maxLength: 500
        lookingFor:
          type: string
          maxLength: 500
        website:
          type: string
          maxLength: 500
        sectors:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [fashion, music, dance, film, art, business, investment, tourism, diplomacy, innovation, technology, ngos, media, education, humanitarian-action, real-estate, health-care]
        isPublic:
          type: boolean
        publicMedia:
          type: boolean
        profileLayout:
          type: string
          enum: [immersive, centered, editorial]
        coverPosition:
          type: integer
          minimum: 0
          maximum: 100
        postsLayout:
          type: string
          enum: [grid, list]
    PublicMember:
      allOf:
        - $ref: "#/components/schemas/MemberProfileInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
            avatarUrl:
              type: ["string", "null"]
              description: Public profile photo only when the member explicitly permits public media.
            enabled:
              type: boolean
              description: Whether this public member has joined the signed-in social network.
    MemberProfile:
      allOf:
        - $ref: "#/components/schemas/PublicMember"
        - type: object
          required: [savedItems, publicMedia]
          properties:
            publicMedia:
              type: boolean
            savedItems:
              type: array
              items:
                type: string
    MemberProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/MemberProfile"
            - type: "null"
